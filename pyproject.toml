[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dji-betaflight-bridge-lab"
version = "0.1.0"
description = "Research scaffold for bridging DJI controller data into Betaflight workflows."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
dji-bf-bridge = "dji_betaflight_bridge.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
